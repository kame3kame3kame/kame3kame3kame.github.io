<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mikomugi315 — つくったアプリ</title>
<meta name="description" content="mikomugi315 がつくったアプリの紹介ページ。">
<style>
  :root{
    --bg:#f5f7fb; --bg2:#eef1f8;
    --card:#ffffff; --text:#16181d; --sub:#6b7280; --line:#e6e9f0;
    --accent:#3b6ef0; --accent-soft:#eef2ff;
    --shadow:0 14px 40px rgba(20,40,90,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1014; --bg2:#13161c;
      --card:#1a1d24; --text:#f1f3f7; --sub:#9aa3b2; --line:#262a33;
      --accent:#6c8cff; --accent-soft:#1e2536;
      --shadow:0 14px 40px rgba(0,0,0,.5);
    }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; color:var(--text);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Helvetica Neue",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg));
    min-height:100vh; line-height:1.6;
  }

  .hero{ text-align:center; padding:72px 20px 26px; }
  .hero .logo{
    font-size:2.4rem; font-weight:800; letter-spacing:.5px; margin:0;
    background:linear-gradient(92deg,#3b6ef0,#7a5cff 55%,#ff5c8a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ margin:12px 0 0; color:var(--sub); font-size:1rem; }

  main{ max-width:720px; margin:0 auto; padding:14px 16px 56px; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:22px; margin:18px 0; display:flex; gap:18px; align-items:flex-start;
    box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 20px 50px rgba(20,40,90,.16); }

  .icon{ width:82px; height:82px; border-radius:20px; flex:none; object-fit:cover;
         box-shadow:0 6px 16px rgba(0,0,0,.18); }
  .icon.ph{ display:flex; align-items:center; justify-content:center;
            font-size:34px; font-weight:800; color:#fff; }

  .body{ flex:1; min-width:0; }
  .titleRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .body h2{ margin:0; font-size:1.2rem; }
  .badge{ font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:999px;
          color:var(--sub); background:var(--accent-soft); white-space:nowrap; }
  .desc{ margin:8px 0 14px; color:var(--sub); font-size:.95rem; }
  .btns{ display:flex; flex-wrap:wrap; gap:8px; }
  .btn{ display:inline-block; padding:9px 16px; border-radius:999px; font-size:.85rem;
        font-weight:600; text-decoration:none; color:var(--accent);
        background:var(--accent-soft); transition:opacity .15s ease; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn:hover{ opacity:.85; }

  footer{ text-align:center; color:var(--sub); font-size:.8rem; padding:8px 20px 48px; }

  @media (max-width:480px){
    .card{ padding:18px; gap:14px; }
    .icon{ width:64px; height:64px; border-radius:16px; }
    .hero{ padding:56px 18px 20px; }
  }
</style>
</head>
<body>
  <header class="hero">
    <h1 class="logo">mikomugi315</h1>
    <p>つくったアプリたち。</p>
  </header>
  <main id="app-list"></main>
  <footer>© 2026 mikomugi315</footer>

<script>
/* =========================================================
   アプリを追加するときは、この apps 配列に1つ足すだけ。
   - name : アプリ名
   - type : "iOS" か "Web"
   - desc : 説明（1〜2行）
   - icon : アイコン画像のパス（無ければ "" → 頭文字＋色で表示）
   - tint : 頭文字アイコンの色（例 "#3b6ef0"）
   - url  : メインのリンク（App Store もしくは Webアプリ）
   - links: 補足リンク [{label, url}, ...]
   ========================================================= */
const apps = [
  {
    name: "SportsLog観戦記録",
    type: "iOS",
    desc: "スポーツ観戦の記録・予定・統計をまとめて残せるアプリ。",
    icon: "icons/sportslog.png",
    tint: "#2E6FD6",
    url: "https://apps.apple.com/app/id6778314609",
    links: [
      { label: "プライバシーポリシー", url: "https://boulder-trouble-ac6.notion.site/SportsLog-6c06dfdac7914fb390fedfbd4fb2ebd9" },
      { label: "利用規約", url: "https://boulder-trouble-ac6.notion.site/37844140375080859a5fd8cecd8a9117" }
    ]
  },
  {
    name: "こころの温度計",
    type: "iOS",
    desc: "こころの状態をやさしく記録するアプリ。",
    icon: "",
    tint: "#ff5c8a",
    url: "https://apps.apple.com/app/id6778290336",
    links: [
      { label: "詳細・プライバシー", url: "https://boulder-trouble-ac6.notion.site/75f8b9423cb14728b827fa836b64121d" },
      { label: "利用規約", url: "https://boulder-trouble-ac6.notion.site/378441403750808285b1df27b09540e0" }
    ]
  },
  {
    name: "逆算ダイエットプランナー",
    type: "Web",
    desc: "目標体重と期日から逆算して、1日のカロリー目標を計算。今の食事・運動から体重の推移も予測できます。",
    icon: "",
    tint: "#22a06b",
    url: "https://gyakusan-diet.netlify.app/",
    links: []
  }
];

function escapeHTML(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const list = document.getElementById("app-list");
list.innerHTML = apps.map(app => {
  const icon = app.icon
    ? `<img class="icon" src="${app.icon}" alt="">`
    : `<div class="icon ph" style="background:linear-gradient(150deg, ${app.tint}, ${app.tint}cc)">${escapeHTML(app.name.charAt(0))}</div>`;
  const primaryLabel = app.type === "Web" ? "使ってみる" : "App Storeで見る";
  let btns = "";
  if (app.url) btns += `<a class="btn primary" href="${app.url}" target="_blank" rel="noopener">${primaryLabel}</a>`;
  (app.links || []).forEach(l => { btns += `<a class="btn" href="${l.url}" target="_blank" rel="noopener">${escapeHTML(l.label)}</a>`; });
  return `<article class="card">
    ${icon}
    <div class="body">
      <div class="titleRow">
        <h2>${escapeHTML(app.name)}</h2>
        <span class="badge">${app.type === "Web" ? "Webアプリ" : "iOSアプリ"}</span>
      </div>
      <p class="desc">${escapeHTML(app.desc)}</p>
      <div class="btns">${btns}</div>
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
